assassins_resume: ادامهٔ فرمان‌های قبلی آدم‌کشان پس از نبرد
assassins_resume_tooltip: آدم‌کشان با پایان درگیری به فرمان‌های پیشین خود برمی‌گردند.
assassins_shortcut: بالا رفتن آدم‌کشان فقط برای مسیر کوتاه‌تر
assassins_shortcut_tooltip: فرمان حرکت عادی بدهید تا آدم‌کشان فقط زمانی بالا بروند که مسیر به‌اندازهٔ کافی کوتاه شود.
workers_unstuck: آزاد کردن کارگران گیرکرده در استراحت
workers_unstuck_tooltip: کارگرانی که در حالت استراحت گیر کرده‌اند می‌توانند به کار برگردند.
workers_jobs_unstuck: جایگزینی کارگران گیرکرده در راه محل کار
workers_jobs_unstuck_tooltip: وقتی کارگر گماشته‌شده نمی‌تواند به ساختمان برسد، ساختمان کارگر جدید می‌گیرد.
ignore_quarry_piles: نادیده گرفتن توده‌های معدن سنگ توسط نیروهای تهاجمی
ignore_quarry_piles_tooltip: واحدهای در حالت تهاجمی، انبارهای سنگ معدن را رها می‌کنند.
rebuild_limit: محدود کردن بازسازی کامل مسیرها پس از مسیر ناموفق
rebuild_limit_tooltip: مسیرهای ناموفق تنها پس از تأخیری کوتاه می‌توانند بازسازی کامل مسیر را آغاز کنند.
