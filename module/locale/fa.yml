assassins_resume: ادامهٔ مسیر آدم‌کشان پس از نبرد
assassins_resume_tooltip: |-
  وقتی آدم‌کشانی که به جایی فرستاده‌اید در راه با دشمنان درگیر می‌شوند، پس از پایان نبرد مانند قبل با بالا رفتن از دیوارها به سوی مقصد اصلی خود ادامه می‌دهند. بدون این گزینه اغلب در همان محل پایان نبرد متوقف می‌شدند.
assassins_shortcut: آدم‌کشان فقط در صورت کوتاه‌تر بودن آشکار از دیوار بالا می‌روند
assassins_shortcut_tooltip: |-
  آدم‌کشان ابتدا مسیر زمینی را می‌جویند و مسیرهای کوتاه را همیشه پیاده می‌روند. وقتی مسیر طولانی باشد، راه روی دیوارها را نیز بررسی می‌کنند و فقط اگر آشکارا کوتاه‌تر باشد بالا می‌روند. دیگر خبری از بالا و پایین رفتن بی‌دلیل از دیوارها نیست. همراه با قوانین مسیر دروازه‌ها در Gatehouse Fixes کار می‌کند.
shortcut_ground_steps: مسیرهای کوتاه‌تر از این هرگز با بالا رفتن جایگزین نمی‌شوند (خانه)
shortcut_ground_steps_tooltip: اگر مسیر زمینی از این تعداد خانه کوتاه‌تر باشد، آدم‌کشان آن را پیاده می‌روند.
shortcut_saving_percent: بالا رفتن باید دست‌کم این مقدار از راه را کم کند (درصد)
shortcut_saving_percent_tooltip: با مقدار 25، آدم‌کشان تنها زمانی از دیوار بالا می‌روند که مسیر دیوار دست‌کم یک‌چهارم از راه زمینی کوتاه‌تر باشد. با 0 هر مسیری را که کوتاه‌تر است انتخاب می‌کنند.
workers_unstuck: کارگران در زمان استراحت گیر نمی‌کنند
workers_unstuck_tooltip: |-
  کارگران هنگام استراحت به سمت باغ، تیرک جشن یا ساختمان زیبای دیگری می‌روند. پیش‌تر اگر راهشان بسته می‌شد برای همیشه همان‌جا گیر می‌کردند و هرگز سر کار برنمی‌گشتند. اکنون مقصد دیگری انتخاب می‌کنند یا پس از پایان استراحت به کار برمی‌گردند.
workers_jobs_unstuck: جایگزینی کارگران گیرکرده در راه کار
workers_jobs_unstuck_tooltip: |-
  کارگری که راهش به محل کار، انبار کالا یا انبار غله بسته می‌ماند پیش‌تر تا ابد همان‌جا می‌ایستاد. اکنون پس از حدود پنج ثانیه تلاش ناموفق به روش عادی بازی کار را ترک می‌کند و کارگر تازه‌ای از کنار آتش اردوگاه می‌آید. کالایی که همراه داشت مانند بازی اصلی از بین می‌رود.
ignore_quarry_piles: نیروهای تهاجمی به انبار سنگ معدن کار ندارند
ignore_quarry_piles_tooltip: نیروهای در حالت تهاجمی دیگر خودسرانه برای حمله به انبار سنگ کنار معدن سنگ دشمن نمی‌روند، همان‌گونه که انبار اصلی را نادیده می‌گیرند. همچنان می‌توانید دستی فرمان حمله به آن بدهید.
rebuild_limit: مسیرهای ناموفق کل نقشه را بازسازی نمی‌کنند
rebuild_limit_tooltip: |-
  وقتی مسیر یک واحد قابل ترسیم نباشد (نقطه‌ای با راه‌های یک‌طرفه)، بازی پیش از صرف‌نظر کردن کل مسیرهای نقشه را بازسازی می‌کند و واحد چند لحظه بعد دوباره تلاش می‌کند، در نتیجه چند واحد گیرکرده بازی را به‌شدت کند می‌کنند. اکنون این بازسازی حداکثر در بازهٔ تعیین‌شده انجام می‌شود و در فاصلهٔ آن مسیر بدون هزینه رد می‌شود.
rebuild_every_ticks: بازسازی مسیرهای نقشه حداکثر هر چند تیک بازی
rebuild_every_ticks_tooltip: 200 تیک در سرعت عادی چند ثانیه است.
balance_changes: تغییرات توازن
bugfixes: رفع اشکال
qol: بهبود تجربه بازی
