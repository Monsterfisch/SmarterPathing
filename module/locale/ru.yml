assassins_resume: Ассасины продолжают путь после боя
assassins_resume_tooltip: |-
  Когда посланные вами ассасины встречают врагов и вступают в бой, после победы они продолжают движение к указанной цели, как и раньше взбираясь на стены по пути. Без этой опции они часто останавливались там, где закончился бой.
assassins_shortcut: Ассасины лезут на стены только при явном сокращении пути
assassins_shortcut_tooltip: |-
  Сначала ассасины ищут путь по земле и всегда проходят короткую дорогу пешком. Если путь длинный, они проверяют и маршрут через стены, но лезут лишь если он заметно короче. Больше никаких лишних подъёмов на стены там, где проще обойти. Работает вместе с правилами маршрутов через ворота из Gatehouse Fixes.
shortcut_ground_steps: Путь короче этого никогда не заменяется лазанием (клеток)
shortcut_ground_steps_tooltip: Если путь по земле короче указанного числа клеток, ассасины просто идут пешком.
shortcut_saving_percent: Лазание должно экономить не менее этой доли пути (процентов)
shortcut_saving_percent_tooltip: При значении 25 ассасины лезут на стену, только если путь по стенам минимум на четверть короче наземного. При 0 они выбирают любой более короткий путь.
workers_unstuck: Отдыхающие рабочие больше не застревают
workers_unstuck_tooltip: |-
  Во время перерыва рабочие идут к саду, майскому дереву или другому украшению. Если путь туда оказывался перекрыт, раньше они стояли бесконечно и не возвращались к работе. Теперь они выбирают другое место или возвращаются к работе по окончании перерыва.
workers_jobs_unstuck: Застрявшие по дороге на работу рабочие заменяются
workers_jobs_unstuck_tooltip: |-
  Рабочий, чей путь к работе, складу или амбару оставался заблокирован, раньше стоял вечно. Теперь примерно через пять секунд безуспешных попыток он уходит обычным игровым способом, а от костра приходит новый рабочий. Несомые товары теряются, как в оригинальной игре.
ignore_quarry_piles: Агрессивные войска не трогают склады каменоломен
ignore_quarry_piles_tooltip: Войска в агрессивной стойке больше не бросаются сами атаковать вражеский склад каменоломни (кучу камня рядом с каменоломней), точно так же, как они игнорируют основной склад. Приказать атаковать его вручную всё ещё можно.
rebuild_limit: Неудачные маршруты не перестраивают всю карту
rebuild_limit_tooltip: |-
  Когда маршрут юнита невозможно проложить (односторонний тупик), игра перестраивает пути всей карты перед отказом — а через мгновение юнит пытается снова, из-за чего горстка застрявших юнитов резко замедляет игру. Теперь перестройка происходит не чаще указанного интервала; в промежутке маршрут просто сразу отменяется без нагрузки.
rebuild_every_ticks: Перестраивать пути карты не чаще чем раз в (игровых тиков)
rebuild_every_ticks_tooltip: 200 тиков — это несколько секунд на обычной скорости.
