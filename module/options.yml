options:
- url: smarter-pathing.assassinsResume
  name: smarter-pathing-assassins-resume
  display: UCP2Switch
  contents:
    type: boolean
    value: true
  header: '{{assassins_resume}}'
  text: '{{assassins_resume_tooltip}}'
  category:
  - '{{bugfixes}}'
- url: smarter-pathing.workersUnstuck
  name: smarter-pathing-workers-unstuck
  display: UCP2Switch
  contents:
    type: boolean
    value: true
  header: '{{workers_unstuck}}'
  text: '{{workers_unstuck_tooltip}}'
  category:
  - '{{bugfixes}}'
- url: smarter-pathing.workersJobsUnstuck
  name: smarter-pathing-workers-jobs-unstuck
  display: UCP2Switch
  contents:
    type: boolean
    value: true
  header: '{{workers_jobs_unstuck}}'
  text: '{{workers_jobs_unstuck_tooltip}}'
  category:
  - '{{bugfixes}}'
- url: smarter-pathing.rebuildLimit
  name: smarter-pathing-rebuild-limit
  display: UCP2Switch
  contents:
    type: boolean
    value: true
  header: '{{rebuild_limit}}'
  text: '{{rebuild_limit_tooltip}}'
  category:
  - '{{bugfixes}}'
  children:
  - display: GroupBox
    hasHeader: true
    accordion:
      enabled: true
    header: '{{rebuild_every_ticks}}'
    text: '{{rebuild_every_ticks_tooltip}}'
    children:
    - url: smarter-pathing.rebuildEveryTicks
      name: smarter-pathing-rebuild-every-ticks
      text: '{{rebuild_every_ticks}}'
      display: Number
      contents:
        type: integer
        value: 200
        min: 10
        max: 5000
        step: 10
- url: smarter-pathing.ignoreQuarryPiles
  name: smarter-pathing-ignore-quarry-piles
  display: UCP2Switch
  contents:
    type: boolean
    value: true
  header: '{{ignore_quarry_piles}}'
  text: '{{ignore_quarry_piles_tooltip}}'
  category:
  - '{{qol}}'
- url: smarter-pathing.assassinsShortcut
  name: smarter-pathing-assassins-shortcut
  display: UCP2Switch
  contents:
    type: boolean
    value: true
  header: '{{assassins_shortcut}}'
  text: '{{assassins_shortcut_tooltip}}'
  category:
  - '{{balance_changes}}'
  children:
  - display: GroupBox
    hasHeader: true
    accordion:
      enabled: true
    header: '{{shortcut_ground_steps}}'
    text: '{{shortcut_ground_steps_tooltip}}'
    children:
    - url: smarter-pathing.shortcutGroundSteps
      name: smarter-pathing-shortcut-ground-steps
      text: '{{shortcut_ground_steps}}'
      display: Number
      contents:
        type: integer
        value: 30
        min: 1
        max: 800
        step: 1
  - display: GroupBox
    hasHeader: true
    accordion:
      enabled: true
    header: '{{shortcut_saving_percent}}'
    text: '{{shortcut_saving_percent_tooltip}}'
    children:
    - url: smarter-pathing.shortcutSavingPercent
      name: smarter-pathing-shortcut-saving-percent
      text: '{{shortcut_saving_percent}}'
      display: Number
      contents:
        type: integer
        value: 25
        min: 0
        max: 90
        step: 5
meta:
  version: 1.0.0
